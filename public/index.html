<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">1-on-1 Video Chat</div>
    <div class="auth-box">
      <div id="loggedOutUI">
        <button id="loginBtn" class="btn btn-login">
          <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px; vertical-align:middle;"><path fill="#ffffff" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
          Login with Google
        </button>
      </div>
      <div id="loggedInUI" class="user-profile hidden">
        <img id="userPhoto" class="user-avatar" src="" alt="User">
        <span id="userName" class="user-name">User</span>
        <button id="logoutBtn" class="btn btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="status">Click START to find a partner</span>
  </div>

  <!-- Video Grid Container -->
  <main class="video-container">
    <!-- Local User Video -->
    <div class="video-card">
      <div class="badge">You</div>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="overlay-controls">
        <button id="toggleMicBtn" class="btn-control">🎤 Mute Mic</button>
        <button id="toggleCamBtn" class="btn-control">📹 Turn Off Cam</button>
      </div>
    </div>

    <!-- Partner Video & Integrated Chat -->
    <div class="video-card">
      <div class="badge">
        <span id="partnerFlag">🌐</span> <span id="partnerName">Partner</span>
      </div>
      <video id="remoteVideo" autoplay playsinline></video>
      
      <!-- Text Chat Overlay -->
      <div class="chat-overlay">
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" placeholder="Connect with a partner to chat..." disabled autocomplete="off">
          <button type="submit" id="sendBtn" class="btn btn-send" disabled>Send</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Bottom Action Panel -->
  <footer class="controls-panel">
    <div class="selector-group">
      <label for="countrySelect">Country:</label>
      <select id="countrySelect" class="custom-select">
        <option value="Global">Global (All Countries)</option>
        <option value="BD">Bangladesh 🇧🇩</option>
        <option value="IN">India 🇮🇳</option>
        <option value="US">United States 🇺🇸</option>
        <option value="UK">United Kingdom 🇬🇧</option>
      </select>
    </div>

    <!-- Big Action Buttons in Order: Report | Start | Stop | Next -->
    <div class="action-buttons">
      <button id="reportBtn" class="btn btn-report btn-lg" disabled title="Report User">🚩 Report</button>
      <button id="startBtn" class="btn btn-primary btn-lg">▶ START</button>
      <button id="stopBtn" class="btn btn-danger btn-lg hidden">⏹ STOP</button>
      <button id="nextBtn" class="btn btn-secondary btn-lg" disabled>NEXT ➔</button>
    </div>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
