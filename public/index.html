<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo">1-on-1 Video Chat</div>
    <div class="auth-container">
      <div id="loggedOutUI">
        <button id="loginBtn">Login with Google</button>
      </div>
      <div id="loggedInUI" class="hidden">
        <img id="userPhoto" class="profile-pic" src="" alt="User">
        <span id="userName">User</span>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="info-bar">
    <span id="status">Select country and click Start to find a partner!</span>
  </div>

  <!-- Main Grid Layout -->
  <main class="main-content">
    
    <!-- Left Column: Local Video (You) -->
    <div class="video-card local-card">
      <div class="video-label">You</div>
      <video id="localVideo" autoplay playsinline muted></video>
      
      <!-- Overlay controls on hover -->
      <div class="overlay-controls">
        <button id="toggleMicBtn">🎤 Mute Mic</button>
        <button id="toggleCamBtn">📹 Turn Off Cam</button>
      </div>
    </div>

    <!-- Right Column: Partner Video + Chat Overlay + Controls -->
    <div class="right-column">
      
      <!-- Partner Card -->
      <div class="partner-card">
        <div class="partner-info-badge">
          <span id="partnerFlag">🌐</span>
          <span id="partnerName">Partner</span>
        </div>
        
        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Chat Overlay inside Partner Video -->
        <div class="chat-overlay">
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-form">
            <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" disabled />
            <button type="submit" id="sendBtn" disabled>Send</button>
          </form>
        </div>
      </div>

      <!-- Controls pinned to bottom -->
      <div class="partner-controls">
        <div class="country-wrapper">
          <label for="countrySelect">Country:</label>
          <select id="countrySelect">
            <option value="Global">Global (All Countries)</option>
            <option value="BD">Bangladesh 🇧🇩</option>
            <option value="IN">India 🇮🇳</option>
            <option value="US">United States 🇺🇸</option>
            <option value="UK">United Kingdom 🇬🇧</option>
          </select>
        </div>

        <div class="action-buttons">
          <button id="reportBtn" class="icon-btn" title="Report User" disabled>🚩</button>
          <button id="startBtn" class="big-btn start-btn">START</button>
          <button id="stopBtn" class="big-btn stop-btn hidden">STOP</button>
          <button id="nextBtn" class="big-btn next-btn" disabled>NEXT ➔</button>
        </div>
      </div>

    </div>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
