<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Language Exchange</title>
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Scripts (v10+ Compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <h1>1-on-1 Language Exchange</h1>

  <!-- Logged Out UI -->
  <div id="loggedOutUI">
    <button id="loginBtn" type="button" onclick="handleGoogleLogin()">Sign in with Google</button>
  </div>

  <!-- Logged In UI (Initially Hidden) -->
  <div id="loggedInUI" class="hidden">
    <span id="userName"></span>
    <button id="logoutBtn" type="button" onclick="handleLogout()">Logout</button>
  </div>

  <br>

  <!-- Control Options -->
  <div class="controls">
    <label>Language:</label>
    <select id="languageSelect">
      <option value="English">English</option>
      <option value="Spanish">Spanish</option>
      <option value="Bengali">Bengali</option>
    </select>

    <label>Country:</label>
    <select id="countrySelect">
      <option value="Global">Global (Any Country)</option>
    </select>

    <button id="startBtn" disabled>Start</button>
    <button id="nextBtn" disabled>Next</button>
  </div>

  <p id="status">Please sign in with Google to start</p>

  <!-- Video Grid -->
  <div class="video-container">
    <div>
      <h3>You</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h3>Partner</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
