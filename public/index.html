<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Language Exchange</title>

  <!-- In-App Browser Auto-Redirect & Alert Script -->
  <script>
    (function () {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // ফেসবুক, মেসেঞ্জার, ইনস্টাগ্রাম, টিকটক ইত্যাদি ইন-অ্যাপ ব্রাউজার চেক
      const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|MicroMessenger/i.test(userAgent);

      if (isInAppBrowser) {
        // অ্যান্ডরয়েড ইউজারদের জন্য সরাসরি Chrome ব্রাউজারে ওপেন করার চেষ্টা করবে
        if (/Android/i.test(userAgent)) {
          const currentUrl = window.location.href.replace(/^https?:\/\//, '');
          window.location.href = `intent://${currentUrl}#Intent;scheme=https;package=com.android.chrome;end`;
        } else {
          // iOS (iPhone) বা অন্য ডিভাইস হলে ইউজারকে নোটিশ দেখাবে
          window.addEventListener('DOMContentLoaded', () => {
            const warningDiv = document.createElement('div');
            warningDiv.style.cssText = 'background: #ff4757; color: #fff; padding: 12px; text-align: center; font-weight: bold; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; font-size: 14px;';
            warningDiv.innerHTML = '⚠️ ক্যামেরা ও মাইক পারমিশনের জন্য ওপরের ৩-ডটে (...) ক্লিক করে <b>Open in Chrome/Safari</b> সিলেক্ট করুন।';
            document.body.prepend(warningDiv);
          });
        }
      }
    })();
  </script>
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Scripts (v10+ Compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <h1>1-on-1 Language Exchange</h1>

  <!-- Logged Out UI -->
  <div id="loggedOutUI">
    <button id="loginBtn" type="button" onclick="handleGoogleLogin()">Sign in with Google</button>
  </div>

  <!-- Logged In UI (Initially Hidden) -->
  <div id="loggedInUI" class="hidden">
    <span id="userName"></span>
    <button id="logoutBtn" type="button" onclick="handleLogout()">Logout</button>
  </div>

  <br>

  <!-- Control Options -->
  <div class="controls">
    <label>Language:</label>
    <select id="languageSelect">
      <option value="All">All Languages</option>
      <option value="English">English</option>
      <option value="Spanish">Spanish</option>
      <option value="Bengali">Bengali</option>
      <option value="Hindi">Hindi</option>
      <option value="Arabic">Arabic</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Mandarin">Mandarin (Chinese)</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Russian">Russian</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Italian">Italian</option>
      <option value="Turkish">Turkish</option>
      <option value="Urdu">Urdu</option>
      <option value="Indonesian">Indonesian</option>
    </select>

    <label>Country:</label>
    <select id="countrySelect">
      <option value="Global">Global (Any Country)</option>
    </select>

    <button id="startBtn" disabled>Start</button>
    <button id="nextBtn" disabled>Next</button>

    <!-- Audio / Video Control Buttons -->
    <button id="muteAudioBtn" onclick="toggleAudio()">🎤 Mute</button>
    <button id="toggleVideoBtn" onclick="toggleVideo()">📹 Video Off</button>

    <!-- Report Button -->
    <button id="reportBtn" onclick="reportUser()" style="background-color: #ff4757; color: white;">🚩 Report</button>
  </div>

  <p id="status">Please sign in with Google to start</p>

  <!-- Video Grid -->
  <div class="video-container">
    <div>
      <h3>You</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h3>Partner</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <!-- Main Script (Cache-busting added to ensure latest JS updates load immediately) -->
  <script src="script.js?v=1.1"></script>
</body>
</html>
