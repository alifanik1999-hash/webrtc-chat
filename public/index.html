<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Navbar / Auth Section -->
  <header class="navbar">
    <h1 class="logo">1-on-1 Video Chat</h1>
    <div class="auth-container">
      <div id="loggedOutUI">
        <button id="loginBtn" class="btn btn-google">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo"> Login with Google
        </button>
      </div>
      <div id="loggedInUI" class="hidden">
        <img id="userPhoto" class="user-avatar" src="" alt="User Photo">
        <span id="userName" class="user-name">User</span>
        <button id="logoutBtn" class="btn btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <div class="status-bar">
      <span id="status">Please sign in with Google to start</span>
    </div>

    <div class="video-grid">
      <!-- Local Video -->
      <div class="video-box">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-label">You</div>
        <div class="controls-overlay">
          <button id="toggleMicBtn" class="btn-control">Mute Mic</button>
          <button id="toggleCamBtn" class="btn-control">Turn Off Cam</button>
        </div>
      </div>

      <!-- Remote Video -->
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-label">
          <span id="partnerFlag">🌐</span> <span id="partnerName">Partner</span>
        </div>
        <!-- Chat Overlay -->
        <div class="chat-overlay">
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-form">
            <input type="text" id="chatInput" placeholder="Connect with a partner to chat..." disabled autocomplete="off">
            <button type="submit" id="sendBtn" disabled>Send</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
      <div class="filter-group">
        <div class="filter-item">
          <label for="languageSelect">Language:</label>
          <select id="languageSelect">
            <option value="English">English</option>
            <option value="Bangla">Bangla 🇧🇩</option>
            <option value="Hindi">Hindi 🇮🇳</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="countrySelect">Country:</label>
          <select id="countrySelect">
            <option value="Global">Global (All Countries)</option>
            <option value="BD">Bangladesh 🇧🇩</option>
            <option value="IN">India 🇮🇳</option>
            <option value="US">USA 🇺🇸</option>
            <option value="UK">UK 🇬🇧</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="reportBtn" class="btn btn-report" disabled>🚩 Report</button>
        <button id="startBtn" class="btn btn-start" disabled>▶ START</button>
        <button id="stopBtn" class="btn btn-stop hidden">⏹ STOP</button>
        <button id="nextBtn" class="btn btn-next" disabled>NEXT ➔</button>
      </div>
    </div>
  </main>

  <!-- ES Modules Integration -->
  <script type="module" src="script.js"></script>
</body>
</html>
