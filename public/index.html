<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>

  <!-- In-App Browser Auto-Redirect & Alert Script -->
  <script>
    (function () {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|MicroMessenger/i.test(userAgent);

      if (isInAppBrowser) {
        if (/Android/i.test(userAgent)) {
          const currentUrl = window.location.href.replace(/^https?:\/\//, '');
          window.location.href = `intent://${currentUrl}#Intent;scheme=https;package=com.android.chrome;end`;
        } else {
          window.addEventListener('DOMContentLoaded', () => {
            const warningDiv = document.createElement('div');
            warningDiv.style.cssText = 'background: #ff4757; color: #fff; padding: 12px; text-align: center; font-weight: bold; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; font-size: 14px;';
            warningDiv.innerHTML = '⚠️ ক্যামেরা ও মাইক পারমিশনের জন্য ওপরের ৩-ডটে (...) ক্লিক করে <b>Open in Chrome/Safari</b> সিলেক্ট করুন।';
            document.body.prepend(warningDiv);
          });
        }
      }
    })();
  </script>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-bar">
    <h1 class="logo">1-on-1 Video Chat</h1>
    
    <!-- Top Right Auth UI -->
    <div class="auth-container">
      <div id="loggedOutUI">
        <button id="loginBtn" type="button" onclick="handleGoogleLogin()">Sign in with Google</button>
      </div>
      <div id="loggedInUI" class="hidden">
        <img id="userPhoto" src="" alt="Profile" class="profile-pic">
        <span id="userName"></span>
        <button id="logoutBtn" type="button" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="info-bar">
    <div id="status">Please sign in with Google to start</div>
  </div>

  <!-- Main Video Section -->
  <div class="main-content">
    
    <!-- 1. Your Video Card (Left Side) -->
    <div class="video-card local-card">
      <span class="video-label">You</span>
      <video id="localVideo" autoplay playsinline muted></video>

      <!-- Hover Controls inside Local Video -->
      <div class="overlay-controls">
        <button id="muteAudioBtn" onclick="toggleAudio()" title="Toggle Mic">🎤 Mute</button>
        <button id="toggleVideoBtn" onclick="toggleVideo()" title="Toggle Camera">📹 Video Off</button>
      </div>
    </div>

    <!-- 2. Partner Video Card (Right Side) -->
    <div class="video-card partner-card">
      <div id="partnerInfo" class="partner-info-badge hidden">
        <span id="partnerFlag">🌐</span>
        <span id="partnerName">Partner</span>
      </div>
      
      <video id="remoteVideo" autoplay playsinline></video>
      
      <!-- OmeTV Style Bottom Right Controls -->
      <div class="partner-controls">
        <div class="country-wrapper">
          <label for="countrySelect">Country:</label>
          <select id="countrySelect">
            <option value="Global">Global (All Countries)</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="Pakistan">Pakistan</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="United Arab Emirates">United Arab Emirates</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Japan">Japan</option>
            <option value="South Korea">South Korea</option>
            <option value="China">China</option>
            <option value="Brazil">Brazil</option>
            <option value="Turkey">Turkey</option>
            <option value="Italy">Italy</option>
            <option value="Spain">Spain</option>
            <option value="Russia">Russia</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Qatar">Qatar</option>
            <option value="Kuwait">Kuwait</option>
          </select>
        </div>

        <div class="action-buttons">
          <button id="startBtn" class="big-btn start-btn" disabled>START</button>
          <button id="stopBtn" class="big-btn stop-btn" disabled>STOP</button>
          <button id="nextBtn" class="big-btn next-btn" disabled>NEXT ➔</button>
          <button id="reportBtn" class="icon-btn report-btn" onclick="reportUser()" title="Report User">🚩</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js?v=2.0"></script>
</body>
</html>
