<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <!-- Custom Fullscreen CSS Grid Layout -->
  <style>
    /* When Fullscreen mode is activated on fullScreenContainer */
    #fullScreenContainer:fullscreen {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      background-color: #0f172a; /* Dark background */
      width: 100vw;
      height: 100vh;
    }

    /* Mobile Responsive Split in Fullscreen */
    @media (max-width: 768px) {
      #fullScreenContainer:fullscreen {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
  </style>

  <!-- Messenger In-App Browser Auto-Redirect -->
  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
      
      if (isFB && /Android/i.test(ua)) {
        var currentUrl = window.location.href;
        var chromeUrl = "intent://" + currentUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
        window.location.href = chromeUrl;
      }
    })();
  </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Short & Smooth Audio Effects -->
  <audio id="connectSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
  <audio id="disconnectSound" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3" preload="auto"></audio>

  <!-- Header Navigation -->
  <header class="flex justify-between items-center p-4 bg-gray-800 border-b border-gray-700">
    <div class="flex items-center gap-4">
      <h1 class="text-xl md:text-2xl font-bold text-blue-400">1-on-1 Video Chat</h1>
      
      <!-- Live Online Users Badge -->
      <div class="flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-full border border-gray-700">
        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
        <span class="text-xs md:text-sm font-semibold text-gray-300">Online: <span id="onlineCount" class="text-green-400 font-bold">0</span></span>
      </div>
    </div>
    
    <!-- Auth UI -->
    <div id="loggedOutUI">
      <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-lg transition text-sm md:text-base">
        Sign in with Google
      </button>
    </div>

    <div id="loggedInUI" class="hidden flex items-center gap-3">
      <img id="userPhoto" class="w-9 h-9 rounded-full border border-gray-500" src="" alt="User">
      <span id="userName" class="text-sm font-medium hidden sm:inline"></span>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-1 flex flex-col items-center justify-center p-3 md:p-6 max-w-6xl mx-auto w-full">
    
    <!-- Status Text & Fullscreen Toggle -->
    <div class="mb-4 text-center flex items-center justify-center gap-4">
      <span id="status" class="bg-gray-800 text-blue-300 border border-gray-700 text-sm md:text-base px-5 py-2.5 rounded-full font-semibold shadow-md">
        Please sign in with Google to start
      </span>
      <button id="fullScreenBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-xs md:text-sm font-bold border border-blue-500 transition shadow-md flex items-center gap-1">
        ⛶ Fullscreen Both
      </button>
    </div>

    <!-- Video Container Grid (Target for Fullscreen) -->
    <div id="fullScreenContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full h-[50vh] md:h-[58vh]">
      
      <!-- Local Stream Video -->
      <div class="relative bg-gray-800 rounded-xl overflow-hidden border border-gray-700 flex items-center justify-center shadow-lg w-full h-full">
        <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <span class="absolute top-3 left-3 bg-black/60 text-white px-3 py-1 rounded-md text-xs md:text-sm font-semibold z-10">You</span>
        
        <div class="absolute bottom-3 left-3 flex gap-2 z-10">
          <button id="muteMicBtn" class="bg-gray-800/90 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-xs md:text-sm font-medium border border-gray-600 transition shadow">Mute Mic</button>
          <button id="toggleCamBtn" class="bg-gray-800/90 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-xs md:text-sm font-medium border border-gray-600 transition shadow">Turn Off Cam</button>
        </div>
      </div>

      <!-- Remote Stream Video -->
      <div class="relative bg-gray-800 rounded-xl overflow-hidden border border-gray-700 flex items-center justify-center shadow-lg w-full h-full">
        <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
        <span class="absolute top-3 left-3 bg-black/60 text-white px-3 py-1 rounded-md text-xs md:text-sm font-semibold z-10">Partner</span>

        <div class="absolute bottom-3 left-3 right-3 flex gap-2 z-10">
          <input id="chatInput" type="text" placeholder="Connect with a partner to chat..." disabled class="flex-1 bg-gray-900/90 text-white px-4 py-2.5 rounded-lg text-sm border border-gray-600 focus:outline-none focus:border-blue-500 disabled:opacity-50 shadow">
          <button id="sendBtn" disabled class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition disabled:opacity-50 shadow">Send</button>
        </div>
      </div>

    </div>

    <!-- Main Action Toolbar -->
    <div class="w-full flex flex-col sm:flex-row items-center justify-between mt-5 bg-gray-800 p-4 md:p-5 rounded-xl border border-gray-700 gap-4 shadow-xl">
      
      <!-- Country Dropdown -->
      <div class="w-full sm:w-auto flex items-center gap-3">
        <div class="w-full sm:w-auto">
          <label class="text-xs text-gray-400 block mb-1 font-semibold uppercase tracking-wider">Country Filter</label>
          <select id="countrySelect" class="w-full sm:w-auto bg-gray-900 text-white px-4 py-3 rounded-lg text-sm md:text-base outline-none border border-gray-700 font-semibold cursor-pointer focus:border-blue-500">
            <option value="Global">🌐 Global (All Countries)</option>
            <option value="Bangladesh">🇧🇩 Bangladesh</option>
            <option value="India">🇮🇳 India</option>
            <option value="United States">🇺🇸 United States</option>
            <option value="United Kingdom">🇬🇧 United Kingdom</option>
            <option value="Canada">🇨🇦 Canada</option>
            <option value="Australia">🇦🇺 Australia</option>
            <option value="Germany">🇩🇪 Germany</option>
            <option value="France">🇫🇷 France</option>
            <option value="United Arab Emirates">🇦🇪 UAE (Dubai)</option>
            <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
            <option value="Qatar">🇶🇦 Qatar</option>
            <option value="Pakistan">🇵🇰 Pakistan</option>
            <option value="Malaysia">🇲🇾 Malaysia</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="w-full sm:w-auto grid grid-cols-2 sm:flex items-center gap-2 md:gap-3">
        <button id="reportBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-5 rounded-lg text-sm md:text-base transition-all duration-150 active:scale-95 shadow-md flex items-center justify-center gap-1.5">
          🚩 Report
        </button>
        <button id="startBtn" disabled class="bg-green-600 hover:bg-green-700 text-white font-extrabold py-3 px-6 rounded-lg text-sm md:text-base transition-all duration-150 active:scale-95 disabled:opacity-40 shadow-md flex items-center justify-center gap-1.5">
          ► START
        </button>
        <button id="stopBtn" disabled class="bg-yellow-600 hover:bg-yellow-700 text-white font-extrabold py-3 px-6 rounded-lg text-sm md:text-base transition-all duration-150 active:scale-95 disabled:opacity-40 shadow-md flex items-center justify-center gap-1.5">
          ⏹ STOP
        </button>
        <button id="nextBtn" disabled class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 px-6 rounded-lg text-sm md:text-base transition-all duration-150 active:scale-95 disabled:opacity-40 shadow-md flex items-center justify-center gap-1.5">
          NEXT ➔
        </button>
      </div>

    </div>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
