<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>

  <!-- In-App Browser Auto-Redirect & Alert Script -->
  <script>
    (function () {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|MicroMessenger/i.test(userAgent);

      if (isInAppBrowser) {
        if (/Android/i.test(userAgent)) {
          const currentUrl = window.location.href.replace(/^https?:\/\//, '');
          window.location.href = `intent://${currentUrl}#Intent;scheme=https;package=com.android.chrome;end`;
        } else {
          window.addEventListener('DOMContentLoaded', () => {
            const warningDiv = document.createElement('div');
            warningDiv.style.cssText = 'background: #ff4757; color: #fff; padding: 12px; text-align: center; font-weight: bold; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; font-size: 14px;';
            warningDiv.innerHTML = '⚠️ ক্যামেরা ও মাইক পারমিশনের জন্য ওপরের ৩-ডটে (...) ক্লিক করে <b>Open in Chrome/Safari</b> সিলেক্ট করুন।';
            document.body.prepend(warningDiv);
          });
        }
      }
    })();
  </script>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <h1>1-on-1 Video Chat</h1>

  <!-- Logged Out UI -->
  <div id="loggedOutUI">
    <button id="loginBtn" type="button" onclick="handleGoogleLogin()">Sign in with Google</button>
  </div>

  <!-- Logged In UI -->
  <div id="loggedInUI" class="hidden">
    <span id="userName"></span>
    <button id="logoutBtn" type="button" onclick="handleLogout()">Logout</button>
  </div>

  <br>

  <!-- Active Device Info Display -->
  <div id="deviceInfo" style="font-size: 13px; color: #bbb; margin-bottom: 12px; background: #222; padding: 6px 12px; border-radius: 6px; display: inline-block;">
    🎥 <b>Camera:</b> <span id="cameraName" style="color: #00d2d3;">Checking...</span> &nbsp;|&nbsp; 
    🎙️ <b>Mic:</b> <span id="micName" style="color: #00d2d3;">Checking...</span>
  </div>

  <!-- Control Options -->
  <div class="controls">
    <label>Country:</label>
    <select id="countrySelect">
      <option value="Global">Global (All Countries)</option>
      <option value="United States">United States</option>
      <option value="United Kingdom">United Kingdom</option>
      <option value="Canada">Canada</option>
      <option value="Australia">Australia</option>
      <option value="Bangladesh">Bangladesh</option>
      <option value="India">India</option>
      <option value="Pakistan">Pakistan</option>
      <option value="Saudi Arabia">Saudi Arabia</option>
      <option value="United Arab Emirates">United Arab Emirates</option>
      <option value="Germany">Germany</option>
      <option value="France">France</option>
      <option value="Japan">Japan</option>
      <option value="South Korea">South Korea</option>
      <option value="China">China</option>
      <option value="Brazil">Brazil</option>
      <option value="Turkey">Turkey</option>
      <option value="Italy">Italy</option>
      <option value="Spain">Spain</option>
      <option value="Russia">Russia</option>
      <option value="Malaysia">Malaysia</option>
      <option value="Singapore">Singapore</option>
      <option value="Qatar">Qatar</option>
      <option value="Kuwait">Kuwait</option>
    </select>

    <button id="startBtn" disabled>Start</button>
    <button id="nextBtn" disabled>Next</button>
    <button id="stopBtn" disabled style="background-color: #d9534f; color: white;">🛑 Stop</button>
    <button id="muteAudioBtn" onclick="toggleAudio()">🎤 Mute</button>
    <button id="toggleVideoBtn" onclick="toggleVideo()">📹 Video Off</button>
    <button id="reportBtn" onclick="reportUser()" style="background-color: #ff4757; color: white;">🚩 Report</button>
  </div>

  <p id="status">Please sign in with Google to start</p>

  <!-- Video Grid -->
  <div class="video-container">
    <div>
      <h3>You</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h3>Partner</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="script.js?v=1.4"></script>
</body>
</html>
