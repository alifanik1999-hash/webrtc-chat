<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-on-1 Video Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <!-- Messenger In-App Browser Auto-Redirect Script -->
  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
      
      if (isFB) {
        var currentUrl = window.location.href;
        // Android-এর জন্য সরাসরি Chrome অ্যাপ ওপেন করার চেষ্টা
        if (/Android/i.test(ua)) {
          var chromeUrl = "intent://" + currentUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
          window.location.href = chromeUrl;
        }
      }
    })();
  </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center p-4 bg-gray-800 border-b border-gray-700">
    <h1 class="text-xl font-bold text-blue-400">1-on-1 Video Chat</h1>
    
    <!-- Auth UI -->
    <div id="loggedOutUI">
      <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition text-sm">
        Sign in with Google
      </button>
    </div>

    <div id="loggedInUI" class="hidden flex items-center gap-3">
      <img id="userPhoto" class="w-8 h-8 rounded-full border border-gray-500" src="" alt="User">
      <span id="userName" class="text-sm font-medium"></span>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-sm transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-6xl mx-auto w-full">
    
    <!-- Status Indicator -->
    <div class="mb-4 text-center">
      <span id="status" class="bg-gray-800 text-blue-300 border border-gray-700 text-sm px-4 py-2 rounded-full font-semibold">
        Please sign in with Google to start
      </span>
    </div>

    <!-- Video Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full h-[55vh] md:h-[60vh]">
      
      <!-- Local Video Container -->
      <div class="relative bg-gray-800 rounded-lg overflow-hidden border border-gray-700 flex items-center justify-center">
        <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <span class="absolute top-2 left-2 bg-black/60 px-2 py-1 rounded text-xs">You</span>
        
        <!-- Local Media Controls -->
        <div class="absolute bottom-2 left-2 flex gap-2">
          <button id="muteMicBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-xs transition">Mute Mic</button>
          <button id="toggleCamBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-xs transition">Turn Off Cam</button>
        </div>
      </div>

      <!-- Remote Video Container -->
      <div class="relative bg-gray-800 rounded-lg overflow-hidden border border-gray-700 flex items-center justify-center">
        <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
        <span class="absolute top-2 left-2 bg-black/60 px-2 py-1 rounded text-xs">Partner</span>
        
        <!-- Chat Overlay Input -->
        <div class="absolute bottom-2 left-2 right-2 flex gap-2">
          <input id="chatInput" type="text" placeholder="Connect with a partner to chat..." disabled class="flex-1 bg-gray-900/80 text-white px-3 py-2 rounded text-sm border border-gray-600 focus:outline-none focus:border-blue-500 disabled:opacity-50">
          <button id="sendBtn" disabled class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition disabled:opacity-50">Send</button>
        </div>
      </div>

    </div>

    <!-- Control Buttons Panel -->
    <div class="w-full flex flex-wrap items-center justify-between mt-6 bg-gray-800 p-4 rounded-lg border border-gray-700 gap-4">
      
      <!-- Country Filter -->
      <div class="flex items-center gap-3">
        <div>
          <label class="text-xs text-gray-400 block mb-1">Country:</label>
          <select id="countrySelect" class="bg-gray-900 text-white px-3 py-2 rounded text-sm outline-none border border-gray-700 font-medium">
            <option value="Global">🌐 Global (All Countries)</option>
            <option value="Bangladesh">🇧🇩 Bangladesh</option>
            <option value="India">🇮🇳 India</option>
            <option value="United States">🇺🇸 United States</option>
            <option value="United Kingdom">🇬🇧 United Kingdom</option>
            <option value="Canada">🇨🇦 Canada</option>
            <option value="Australia">🇦🇺 Australia</option>
            <option value="Germany">🇩🇪 Germany</option>
            <option value="France">🇫🇷 France</option>
            <option value="United Arab Emirates">🇦🇪 UAE (Dubai)</option>
            <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
            <option value="Qatar">🇶🇦 Qatar</option>
            <option value="Pakistan">🇵🇰 Pakistan</option>
            <option value="Malaysia">🇲🇾 Malaysia</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button id="reportBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-sm transition flex items-center gap-1">
          🚩 Report
        </button>
        <button id="startBtn" disabled class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded text-sm transition disabled:opacity-50 flex items-center gap-1">
          ► START
        </button>
        <button id="stopBtn" disabled class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-5 rounded text-sm transition disabled:opacity-50 flex items-center gap-1">
          ⏹ STOP
        </button>
        <button id="nextBtn" disabled class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded text-sm transition disabled:opacity-50 flex items-center gap-1">
          NEXT ➔
        </button>
      </div>

    </div>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
