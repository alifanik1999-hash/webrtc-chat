<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1-on-1 Video Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="navbar">
    <div class="logo">1-on-1 Video Chat</div>
    <div class="auth-box">
      <div id="loggedOutUI">
        <button id="loginBtn" class="btn btn-login">Login with Google</button>
      </div>
      <div id="loggedInUI" class="user-profile hidden">
        <img id="userPhoto" src="" alt="User Avatar" class="user-avatar" />
        <span id="userName" class="user-name"></span>
        <button id="logoutBtn" class="btn btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="status-bar">
    <p id="status">Select country and click Start to find a partner!</p>
  </div>

  <!-- Main Video Container Layout -->
  <main class="video-container">
    
    <!-- Local User Video Panel -->
    <div class="video-card my-card">
      <span class="badge">You</span>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="overlay-controls">
        <button id="toggleMicBtn" class="btn btn-control">🎤 Mute Mic</button>
        <button id="toggleCamBtn" class="btn btn-control">📹 Turn Off Cam</button>
      </div>
    </div>

    <!-- Remote Partner Video & Chat Panel -->
    <div class="video-card partner-card">
      <span class="badge partner-badge"><span id="partnerFlag">🌐</span> <span id="partnerName">Partner</span></span>
      <video id="remoteVideo" autoplay playsinline></video>
      
      <!-- Text Chat Overlay -->
      <div class="chat-overlay">
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" placeholder="Connect with a partner to chat..." disabled autocomplete="off" />
          <button type="submit" id="sendBtn" class="btn btn-send" disabled>Send</button>
        </form>
      </div>
    </div>

  </main>

  <!-- Control Panel & Matchmaking -->
  <footer class="controls-panel">
    <div class="selector-group">
      <label for="countrySelect">Country:</label>
      <select id="countrySelect" class="custom-select">
        <option value="Global">Global (All Countries)</option>
        <option value="BD">Bangladesh 🇧🇩</option>
        <option value="IN">India 🇮🇳</option>
        <option value="US">United States 🇺🇸</option>
        <option value="UK">United Kingdom 🇬🇧</option>
      </select>
    </div>

    <div class="action-buttons">
      <button id="reportBtn" class="btn btn-report" disabled>🚩</button>
      <button id="startBtn" class="btn btn-primary">START</button>
      <button id="stopBtn" class="btn btn-danger hidden">STOP</button>
      <button id="nextBtn" class="btn btn-secondary" disabled>NEXT ➔</button>
    </div>
  </footer>

  <!-- Socket.io & App Module Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
